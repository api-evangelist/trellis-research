server:
  name: Trellis Law MCP
  url: https://mcp.trellis.law/mcp
  transport: http
  authentication:
    type: oauth2
    issuer: https://mcp.trellis.law
    authorization_endpoint: https://mcp.trellis.law/oauth/authorize
    token_endpoint: https://mcp.trellis.law/oauth/token
