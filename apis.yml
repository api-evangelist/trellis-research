name: Trellis Research
description: >-
  Trellis (trellis.law) is an AI-powered state and federal court research and
  litigation analytics platform built by litigators for legal teams. It
  aggregates the most extensive U.S. trial court data available — State Trial,
  Federal, District, Appellate, Supreme Court, and Bankruptcy cases across all
  50 states plus DC — and exposes it through Smart Search, a REST Data API (V2,
  with federal and PACER integration), and a remote OAuth-secured MCP server.
  Capabilities include case/docket search, document retrieval, tentative
  rulings, verdict records, judge and firm analytics, party and expert search,
  case/topic alerts, and webhook notifications for docket refreshes.
