    REST Data API (V2, May 2024) for programmatic access to U.S. state and
    federal trial court data — Search (Boolean/query over Cases, Documents,
    Rulings with filtering and sorting), Rulings, Judges, Usage (billing-cycle
    usage stats), and Webhooks (manage refresh/alert notifications). API-key
    auth via the Authorization header.
